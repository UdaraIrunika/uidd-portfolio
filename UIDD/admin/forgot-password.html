<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Admin Panel</title>
    <link rel="stylesheet" href="css/admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: var(--dark-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .forgot-password-container {
            background: var(--dark-secondary);
            border: 1px solid rgba(0, 217, 255, 0.1);
            border-radius: var(--border-radius);
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .forgot-password-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .forgot-password-header h1 {
            font-size: 1.8rem;
            color: var(--light);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .forgot-password-header h1 i {
            color: var(--primary);
            font-size: 2rem;
        }

        .forgot-password-header p {
            color: rgba(224, 224, 224, 0.6);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--light);
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(10, 14, 23, 0.5);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 6px;
            color: var(--light);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(10, 14, 23, 0.8);
            box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.1);
        }

        .form-group input::placeholder {
            color: rgba(224, 224, 224, 0.4);
        }

        .form-group small {
            display: block;
            color: rgba(224, 224, 224, 0.5);
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn-submit {
            flex: 1;
            padding: 12px 20px;
            background: var(--primary);
            color: var(--dark-bg);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn-submit:hover {
            background: #00bde8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 217, 255, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-back-login {
            flex: 1;
            padding: 12px 20px;
            background: rgba(0, 217, 255, 0.1);
            color: var(--primary);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn-back-login:hover {
            background: rgba(0, 217, 255, 0.15);
            border-color: rgba(0, 217, 255, 0.5);
        }

        .info-message {
            background: rgba(0, 217, 255, 0.05);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 6px;
            padding: 12px 15px;
            color: rgba(224, 224, 224, 0.8);
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .info-message i {
            color: var(--primary);
            margin-top: 2px;
            flex-shrink: 0;
        }

        .success-message {
            display: none;
            background: rgba(0, 217, 127, 0.1);
            border: 1px solid rgba(0, 217, 127, 0.3);
            border-radius: 6px;
            padding: 15px;
            color: #00d97f;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }

        .success-message i {
            margin-right: 8px;
        }

        @media (max-width: 480px) {
            .forgot-password-container {
                padding: 30px 20px;
            }

            .forgot-password-header h1 {
                font-size: 1.5rem;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn-submit,
            .btn-back-login {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="forgot-password-container">
        <div class="forgot-password-header">
            <h1>
                <i class="fas fa-lock"></i>
                Reset Password
            </h1>
            <p>Enter your email address and we'll send you a link to reset your password.</p>
        </div>

        <div class="info-message">
            <i class="fas fa-info-circle"></i>
            <span>We'll send a password reset link to your registered email address.</span>
        </div>

        <div class="success-message" id="successMessage">
            <i class="fas fa-check-circle"></i>
            <span id="successText">Password reset link sent successfully!</span>
        </div>

        <form id="forgotPasswordForm" onsubmit="handleForgotPassword(event)">
            <div class="form-group">
                <label for="email">Email Address <span style="color: var(--danger);">*</span></label>
                <input type="email" id="email" name="email" placeholder="admin@example.com" required>
                <small>Enter the email address associated with your account</small>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">
                    <i class="fas fa-envelope"></i> Send Reset Link
                </button>
                <button type="button" class="btn-back-login" onclick="goBackToLogin()">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </button>
            </div>
        </form>
    </div>

    <script>
        function handleForgotPassword(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const form = document.getElementById('forgotPasswordForm');
            const successMessage = document.getElementById('successMessage');
            const successText = document.getElementById('successText');

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('Please enter a valid email address!');
                return;
            }

            // Show success message
            form.style.display = 'none';
            successMessage.style.display = 'flex';
            successText.textContent = `A password reset link has been sent to ${email}. Please check your email (including spam folder) and click the link to reset your password.`;

            // Redirect after 3 seconds
            setTimeout(() => {
                window.location.href = '/admin/login.html';
            }, 3000);
        }

        function goBackToLogin() {
            window.location.href = '/admin/login.html';
        }

        // Auto-focus email field
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('email').focus();
        });
    </script>
</body>
</html>
